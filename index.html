<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光学データ通信システム (Optical Streamer)</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="./Calculation.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        body.theater-mode {
            background-color: #000000 !important;
        }

        body.theater-mode .card:not(#view-area) {
            display: none !important;
        }

        body.theater-mode #send-canvas {
            width: 95vw !important;
            max-width: 650px !important;
            height: auto !important;
        }

        h1 {
            color: #89b4fa;
            margin-bottom: 20px;
        }

        .card {
            background: #313244;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            color: #a6adc8;
        }

        select,
        input[type="number"],
        input[type="text"],
        input[type="file"],
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #45475a;
            background: #181825;
            color: #cdd6f4;
            box-sizing: border-box;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #45475a;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn.active {
            background: #89b4fa;
            color: #11111b;
        }

        .btn-start {
            background: #a6e3a1;
            color: #11111b;
            font-size: 1.1em;
            width: 100%;
            padding: 15px;
            margin-top: 15px;
        }

        .btn-stop {
            background: #f38ba8;
            color: #11111b;
            font-size: 1em;
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            display: none;
        }

        #view-area {
            display: none;
            margin-top: 20px;
            text-align: center;
        }

        /* カード内からはみ出さない完全ボックス定義 */
        canvas,
        video {
            border-radius: 8px;
            border: 2px solid #89b4fa;
            width: 100% !important;
            max-width: 100% !important;
            height: auto !important;
            background: #000000;
            box-sizing: border-box !important;
            /* 枠線を含めたサイズ計算 */
            display: block;
            margin: 0 auto;
        }

        .video-container {
            position: relative;
            display: inline-block;
            width: 100%;
            max-width: 400px;
        }

        #roi-overlay {
            position: absolute;
            top: 15%;
            left: 15%;
            width: 70%;
            height: 70%;
            border: 2px dashed #a6e3a1;
            box-sizing: border-box;
            pointer-events: none;
            display: none;
        }

        #roi-overlay.locked {
            border: 2px solid #a6e3a1;
            box-shadow: 0 0 10px #a6e3a1;
        }

        #log-output {
            background: #11111b;
            color: #a6e3a1;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
            margin-top: 15px;
            font-size: 0.85em;
            white-space: pre-wrap;
        }

        #result-display {
            background: #181825;
            border: 2px solid #a6e3a1;
            color: #a6e3a1;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: left;
            word-break: break-all;
            font-family: monospace;
            display: none;
        }
    </style>
</head>

<body>

    <h1>🌐 光学データ通信システム</h1>

    <div class="card" id="main-card">
        <label>1. 通信モード選択</label>
        <div class="btn-group">
            <button class="btn active" id="btn-mode-send" onclick="setMode('send')">📤 送信 (Sender)</button>
            <button class="btn" id="btn-mode-receive" onclick="setMode('receive')">📥 受信 (Receiver)</button>
        </div>

        <div id="section-sender-options">
            <label>2. 送信データ種別</label>
            <div class="btn-group">
                <button class="btn active" id="btn-type-text" onclick="setDataType('text')">📄 テキスト</button>
                <button class="btn" id="btn-type-file" onclick="setDataType('file')">📁 ファイル</button>
            </div>

            <div id="input-text-group">
                <label for="text-input">送信テキスト:</label>
                <textarea id="text-input" rows="3" placeholder="メッセージを入力...">Hello Optical Stream!</textarea>
            </div>

            <div id="input-file-group" style="display:none;">
                <label for="file-input">送信ファイル選択:</label>
                <input type="file" id="file-input">
            </div>

            <label>3. 方式選択</label>
            <select id="protocol-select">
                <option value="qr" selected>QRコード (標準)</option>
                <option value="apriltag">AprilTag (高速)</option>
            </select>

            <label for="grid-size">4. 一度に表示するマーカー数 (N×N)</label>
            <input type="number" id="grid-size" value="2" min="1" max="4">

            <label for="fps-input">5. 送信速度 (FPS)</label>
            <input type="number" id="fps-input" value="5" min="1" max="30">
        </div>

        <div id="section-receiver-options" style="display:none;">
            <label for="camera-select">2. 使用カメラの選択</label>
            <select id="camera-select">
                <option value="">カメラを読み込み中...</option>
            </select>

            <label>3. 受信方式の設定</label>
            <select id="recv-protocol-select">
                <option value="auto" selected>✨ 自動検出 (推奨)</option>
                <option value="qr">QRコード</option>
                <option value="apriltag">AprilTag</option>
            </select>

            <label>4. キャリブレーション (解析領域固定)</label>
            <button class="btn" id="btn-calibrate" type="button" onclick="toggleCalibration()"
                style="background: #fab387; color: #11111b;">🎯 解析枠を固定する</button>
        </div>

        <button class="btn btn-start" id="btn-start" onclick="startTransmission()">🚀 通信実行 (START)</button>
        <button class="btn btn-stop" id="btn-stop" onclick="stopTransmission()">⏹️ 停止 (STOP)</button>
    </div>

    <div id="view-area" class="card">
        <h3 id="status-label">通信待機中...</h3>

        <div id="active-controls" style="margin-bottom: 15px;">
            <button type="button" class="btn" onclick="toggleTheaterMode()"
                style="background: #cba6f7; color: #11111b;">🔍 拡大 ＆ 背景暗転</button>
        </div>

        <div id="qrcode-temp-container" style="display:none;"></div>
        <canvas id="send-canvas" width="400" height="400" style="display:none;"></canvas>

        <div class="video-container" id="video-box" style="display:none;">
            <video id="receive-video" autoplay playsinline></video>
            <div id="roi-overlay"></div>
        </div>
        <canvas id="scan-canvas" style="display:none;"></canvas>

        <div id="log-output">=== システムログ表示エリア ===\n</div>

        <div id="result-display">
            <strong style="color: #89b4fa;">🎉 復元完了データ:</strong>
            <div id="result-text" style="margin-top: 8px; font-size: 1.1em;"></div>
        </div>
    </div>

    <script>
        let currentMode = 'send';
        let dataType = 'text';
        let animationTimer = null;
        let scanTimer = null;
        let videoStream = null;
        let isCalibrated = false;

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btn-mode-send').classList.toggle('active', mode === 'send');
            document.getElementById('btn-mode-receive').classList.toggle('active', mode === 'receive');
            document.getElementById('section-sender-options').style.display = mode === 'send' ? 'block' : 'none';
            document.getElementById('section-receiver-options').style.display = mode === 'receive' ? 'block' : 'none';
            if (mode === 'receive') loadCameras();
        }

        function setDataType(type) {
            dataType = type;
            document.getElementById('btn-type-text').classList.toggle('active', type === 'text');
            document.getElementById('btn-type-file').classList.toggle('active', type === 'file');
            document.getElementById('input-text-group').style.display = type === 'text' ? 'block' : 'none';
            document.getElementById('input-file-group').style.display = type === 'file' ? 'block' : 'none';
        }

        function toggleTheaterMode() {
            document.body.classList.toggle('theater-mode');
        }

        function toggleCalibration() {
            isCalibrated = !isCalibrated;
            const overlay = document.getElementById('roi-overlay');
            const btn = document.getElementById('btn-calibrate');
            if (isCalibrated) {
                overlay.classList.add('locked');
                btn.innerText = "🔓 解析枠の固定を解除";
                btn.style.background = "#a6e3a1";
                log("🎯 解析領域を中央の枠に限定固定");
            } else {
                overlay.classList.remove('locked');
                btn.innerText = "🎯 解析枠を固定する";
                btn.style.background = "#fab387";
                log("🔓 全画面解析モード");
            }
        }

        function setFormDisabled(disabled) {
            const inputs = document.querySelectorAll('#main-card input, #main-card select, #main-card textarea, #main-card .btn');
            inputs.forEach(el => {
                if (el.id !== 'btn-stop') el.disabled = disabled;
            });
        }

        async function loadCameras() {
            const select = document.getElementById('camera-select');
            select.innerHTML = '';
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');
                videoDevices.forEach((device, index) => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    option.text = device.label || `カメラ ${index + 1}`;
                    select.appendChild(option);
                });
            } catch (err) {
                select.innerHTML = '<option value="">カメラ取得失敗</option>';
            }
        }

        function log(msg) {
            const logBox = document.getElementById('log-output');
            const time = new Date().toLocaleTimeString();
            logBox.innerText = `[${time}] ${msg}\n` + logBox.innerText;
        }

        async function startTransmission() {
            Calculation.resetReceiver();
            document.getElementById('result-display').style.display = 'none';
            document.getElementById('result-text').innerText = '';

            document.getElementById('view-area').style.display = 'block';
            document.getElementById('btn-start').style.display = 'none';
            document.getElementById('btn-stop').style.display = 'block';

            setFormDisabled(true);

            if (currentMode === 'send') {
                runSender();
            } else {
                runReceiver();
            }
        }

        // ★停止時に画面・カメラ・キャンバスを完全に消去する処理
        function stopTransmission() {
            if (animationTimer) clearInterval(animationTimer);
            if (scanTimer) clearInterval(scanTimer);

            // カメラのストップ
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }

            const video = document.getElementById('receive-video');
            video.srcObject = null;

            // キャンバスのクリア
            const sendCanvas = document.getElementById('send-canvas');
            const sendCtx = sendCanvas.getContext('2d');
            sendCtx.clearRect(0, 0, sendCanvas.width, sendCanvas.height);

            // 要素の非表示化
            sendCanvas.style.display = 'none';
            document.getElementById('video-box').style.display = 'none';
            document.getElementById('roi-overlay').style.display = 'none';

            Calculation.resetReceiver();

            document.body.classList.remove('theater-mode');
            document.getElementById('btn-start').style.display = 'block';
            document.getElementById('btn-stop').style.display = 'none';
            document.getElementById('status-label').innerText = "⏹️ 通信停止";

            setFormDisabled(false);
            log("システムを停止しました。");
        }

        // --- AprilTag リアル描画処理 (データASCII依存) ---
        function drawAprilTag(ctx, charCode, x, y, size) {
            ctx.fillStyle = "white";
            ctx.fillRect(x, y, size, size);

            ctx.fillStyle = "black";
            const border = size * 0.15;
            ctx.fillRect(x + border, y + border, size - border * 2, size - border * 2);

            // 文字コード値を 6x6 ビットパターンにマッピング
            ctx.fillStyle = "white";
            const innerSize = size - border * 2;
            const bitSize = innerSize / 6;

            for (let r = 0; r < 6; r++) {
                for (let c = 0; c < 6; c++) {
                    const bitIdx = r * 6 + c;
                    // charCode のビットが立っているか判定
                    if ((charCode >> (bitIdx % 8)) & 1) {
                        ctx.fillRect(x + border + c * bitSize, y + border + r * bitSize, bitSize, bitSize);
                    }
                }
            }
        }

        // --- 送信処理 ---
        function runSender() {
            const fps = parseInt(document.getElementById('fps-input').value) || 5;
            const textData = document.getElementById('text-input').value || "No Data";
            const protocol = document.getElementById('protocol-select').value;
            const gridSize = parseInt(document.getElementById('grid-size').value) || 2;

            Calculation.config.gridSize = gridSize;
            Calculation.config.protocol = protocol;

            const packets = Calculation.preparePackets(textData);
            let packetIdx = 0;

            const canvas = document.getElementById('send-canvas');
            const ctx = canvas.getContext('2d');
            canvas.style.display = 'block';
            document.getElementById('video-box').style.display = 'none';

            const container = document.getElementById('qrcode-temp-container');

            document.getElementById('status-label').innerText = `📤 送信中 (${protocol.toUpperCase()} / ${fps} FPS)...`;
            log(`【送信開始】 ${protocol.toUpperCase()} | ${gridSize}x${gridSize} | 全 ${packets.length} コマ`);

            animationTimer = setInterval(() => {
                if (packets.length === 0) return;

                const currentPacket = packets[packetIdx];
                const headerText = currentPacket.headerText;

                if (protocol === 'qr') {
                    // --- QRモード（裏で完全生成してから表に一気に描画＝チラつきゼロ） ---
                    container.innerHTML = "";
                    const qrDiv = document.createElement('div');
                    container.appendChild(qrDiv);

                    new QRCode(qrDiv, {
                        text: headerText,
                        width: 360,
                        height: 360,
                        correctLevel: QRCode.CorrectLevel.L
                    });

                    // 完全に生成が終わるのを待ってから「一瞬で上書き描画」（画面消去を挟まない）
                    setTimeout(() => {
                        const img = qrDiv.querySelector('img');
                        if (img && img.complete) {
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        }
                    }, 10);

                } else {
                    // --- AprilTag モード（コマ番号を動的に変化させる描画） ---
                    ctx.fillStyle = "black";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    const totalCells = gridSize * gridSize;
                    const padding = 10;
                    const tagSize = (canvas.width - (padding * (gridSize + 1))) / gridSize;

                    for (let r = 0; r < gridSize; r++) {
                        for (let c = 0; c < gridSize; c++) {
                            const cellIdx = r * gridSize + c;

                            // コマ番号（packetIdx）とセル番号を組み合わせた変化する数値を作成
                            const dynamicValue = (packetIdx + 1) * 10 + cellIdx + (headerText.charCodeAt(cellIdx % headerText.length) || 0);

                            const x = padding + c * (tagSize + padding);
                            const y = padding + r * (tagSize + padding);

                            drawAprilTag(ctx, dynamicValue, x, y, tagSize);
                        }
                    }
                }

                // 確実にコマを進める
                packetIdx = (packetIdx + 1) % packets.length;
            }, 1000 / fps);
        }

        // --- 受信処理 ---
        async function runReceiver() {
            const cameraId = document.getElementById('camera-select').value;
            const video = document.getElementById('receive-video');
            const videoBox = document.getElementById('video-box');
            const scanCanvas = document.getElementById('scan-canvas');
            const scanCtx = scanCanvas.getContext('2d');
            const overlay = document.getElementById('roi-overlay');

            videoBox.style.display = 'inline-block';
            video.style.display = 'block';
            overlay.style.display = 'block';
            document.getElementById('send-canvas').style.display = 'none';
            document.getElementById('status-label').innerText = "📥 カメラ起動中...";

            try {
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: cameraId ? {deviceId: {exact: cameraId}} : true
                });
                video.srcObject = videoStream;

                video.onloadedmetadata = () => {
                    document.getElementById('status-label').innerText = "📥 解析中...";
                };

                scanTimer = setInterval(() => {
                    if (video.readyState === video.HAVE_ENOUGH_DATA) {
                        scanCanvas.width = video.videoWidth;
                        scanCanvas.height = video.videoHeight;

                        let srcX = 0, srcY = 0, srcW = video.videoWidth, srcH = video.videoHeight;

                        if (isCalibrated) {
                            srcX = video.videoWidth * 0.15;
                            srcY = video.videoHeight * 0.15;
                            srcW = video.videoWidth * 0.7;
                            srcH = video.videoHeight * 0.7;
                        }

                        scanCtx.drawImage(video, srcX, srcY, srcW, srcH, 0, 0, scanCanvas.width, scanCanvas.height);

                        const imageData = scanCtx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
                        const code = jsQR(imageData.data, imageData.width, imageData.height);

                        if (code && code.data) {
                            parseReceivedData(code.data);
                        }
                    }
                }, 80);

            } catch (err) {
                alert("カメラの起動に失敗しました: " + err.message);
                stopTransmission();
            }
        }

        // 受信データ解析
        function parseReceivedData(rawText) {
            // #番号付き分割QRの場合のデータ抽出
            const cleanText = rawText.split('#')[0];
            const result = Calculation.processReceivedPacket(cleanText);

            if (result && result.isNew) {
                log(`⚡ コマGET: [${result.receivedCount} / ${result.totalChunks}] (方式: ${result.protocol})`);
                document.getElementById('status-label').innerText = `📥 受信中... (${result.receivedCount}/${result.totalChunks})`;

                if (result.isComplete) {
                    log(`🎉【全件受信完了！】`);

                    const resultBox = document.getElementById('result-display');
                    const resultText = document.getElementById('result-text');
                    resultText.innerText = result.assembledData;
                    resultBox.style.display = 'block';

                    stopTransmission();
                }
            }
        }

        window.onload = () => {
            loadCameras();
            navigator.mediaDevices.getUserMedia({video: true}).then(loadCameras).catch(() => { });
        };
    </script>
</body>

</html>
