<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光学データ通信システム (Optical Streamer)</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #89b4fa; margin-bottom: 20px; }
        .card {
            background: #313244;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
            margin-bottom: 15px;
        }
        label { display: block; margin-top: 10px; font-weight: bold; color: #a6adc8; }
        select, input[type="number"], input[type="file"], textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #45475a;
            background: #181825;
            color: #cdd6f4;
            box-sizing: border-box;
        }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #45475a;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn.active { background: #89b4fa; color: #11111b; }
        .btn-start {
            background: #a6e3a1;
            color: #11111b;
            font-size: 1.1em;
            width: 100%;
            padding: 15px;
            margin-top: 15px;
        }
        .btn-stop {
            background: #f38ba8;
            color: #11111b;
            font-size: 1em;
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            display: none;
        }
        #view-area { display: none; margin-top: 20px; text-align: center; }
        canvas, video { border-radius: 8px; border: 2px solid #89b4fa; max-width: 100%; background: #ffffff; }
        #log-output {
            background: #11111b;
            color: #a6e3a1;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            text-align: left;
            max-height: 180px;
            overflow-y: auto;
            margin-top: 10px;
            font-size: 0.85em;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <h1>🌐 光学データ通信システム</h1>

    <div class="card">
        <label>1. 通信モード選択</label>
        <div class="btn-group">
            <button class="btn active" id="btn-mode-send" onclick="setMode('send')">📤 送信 (Sender)</button>
            <button class="btn" id="btn-mode-receive" onclick="setMode('receive')">📥 受信 (Receiver)</button>
        </div>

        <div id="section-sender-options">
            <label>2. 送信データ種別</label>
            <div class="btn-group">
                <button class="btn active" id="btn-type-text" onclick="setDataType('text')">📄 テキスト</button>
                <button class="btn" id="btn-type-file" onclick="setDataType('file')">📁 ファイル</button>
            </div>

            <div id="input-text-group">
                <label for="text-input">送信テキスト:</label>
                <textarea id="text-input" rows="3" placeholder="メッセージを入力...">Hello Optical Stream!</textarea>
            </div>

            <div id="input-file-group" style="display:none;">
                <label for="file-input">送信ファイル選択:</label>
                <input type="file" id="file-input">
            </div>

            <label>3. 方式選択</label>
            <select id="protocol-select">
                <option value="qr" selected>QRコード (標準)</option>
                <option value="apriltag">AprilTag (高速描画)</option>
            </select>

            <label for="grid-size">4. 一度に表示するマーカー数 (N×N)</label>
            <input type="number" id="grid-size" value="3" min="1" max="5">
            <small style="color: #6c7086;">※ 推奨: 3 (3x3=9個)</small>

            <label for="fps-input">5. 送信速度 (FPS)</label>
            <input type="number" id="fps-input" value="5" min="1" max="30">
            <small style="color: #6c7086;">※ 推奨: 5 FPS</small>
        </div>

        <div id="section-receiver-options" style="display:none;">
            <label for="camera-select">2. 使用カメラの選択</label>
            <select id="camera-select">
                <option value="">カメラを読み込み中...</option>
            </select>

            <label for="recv-grid-size">3. 受信側想定マーカー数 (N×N)</label>
            <input type="number" id="recv-grid-size" value="3" min="1" max="5">
            <small style="color: #6c7086;">※ 送信側と同じ数値を入力すると検証精度が向上します</small>
        </div>

        <button class="btn btn-start" id="btn-start" onclick="startTransmission()">🚀 通信実行 (START)</button>
        <button class="btn btn-stop" id="btn-stop" onclick="stopTransmission()">⏹️ 停止 (STOP)</button>
    </div>

    <div id="view-area" class="card">
        <h3 id="status-label">通信待機中...</h3>
        
        <div id="qrcode-temp" style="display:none;"></div>
        <canvas id="send-canvas" width="450" height="450" style="display:none;"></canvas>
        
        <video id="receive-video" autoplay playsinline style="display:none;"></video>
        <canvas id="scan-canvas" style="display:none;"></canvas>

        <div id="log-output">=== システムログ表示エリア ===\n</div>
    </div>

    <script>
        let currentMode = 'send';
        let dataType = 'text';
        let animationTimer = null;
        let scanTimer = null;
        let videoStream = null;

        let receivedChunks = {};
        let totalChunksExpected = null;

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btn-mode-send').classList.toggle('active', mode === 'send');
            document.getElementById('btn-mode-receive').classList.toggle('active', mode === 'receive');
            document.getElementById('section-sender-options').style.display = mode === 'send' ? 'block' : 'none';
            document.getElementById('section-receiver-options').style.display = mode === 'receive' ? 'block' : 'none';
            if (mode === 'receive') loadCameras();
        }

        function setDataType(type) {
            dataType = type;
            document.getElementById('btn-type-text').classList.toggle('active', type === 'text');
            document.getElementById('btn-type-file').classList.toggle('active', type === 'file');
            document.getElementById('input-text-group').style.display = type === 'text' ? 'block' : 'none';
            document.getElementById('input-file-group').style.display = type === 'file' ? 'block' : 'none';
        }

        async function loadCameras() {
            const select = document.getElementById('camera-select');
            select.innerHTML = '';
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');
                videoDevices.forEach((device, index) => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    option.text = device.label || `カメラ ${index + 1}`;
                    select.appendChild(option);
                });
            } catch (err) {
                select.innerHTML = '<option value="">カメラの取得に失敗しました</option>';
            }
        }

        function log(msg) {
            const logBox = document.getElementById('log-output');
            const time = new Date().toLocaleTimeString();
            logBox.innerText = `[${time}] ${msg}\n` + logBox.innerText;
        }

        async function startTransmission() {
            document.getElementById('view-area').style.display = 'block';
            document.getElementById('btn-start').style.display = 'none';
            document.getElementById('btn-stop').style.display = 'block';

            if (currentMode === 'send') {
                runSender();
            } else {
                runReceiver();
            }
        }

        function stopTransmission() {
            if (animationTimer) clearInterval(animationTimer);
            if (scanTimer) clearInterval(scanTimer);
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }

            document.getElementById('btn-start').style.display = 'block';
            document.getElementById('btn-stop').style.display = 'none';
            document.getElementById('status-label').innerText = "⏹️ 通信停止";
            log("システムを停止しました。");
        }

        // --- 送信処理 (QR / AprilTag 対応) ---
        function runSender() {
            const fps = parseInt(document.getElementById('fps-input').value) || 5;
            const textData = document.getElementById('text-input').value || "No Data";
            const protocol = document.getElementById('protocol-select').value;
            const gridSize = parseInt(document.getElementById('grid-size').value) || 3;
            
            // 1コマあたりのデータサイズ
            const chunkSize = 40 * (gridSize * gridSize);
            const totalChunks = Math.ceil(textData.length / chunkSize);
            let chunkIdx = 0;

            const canvas = document.getElementById('send-canvas');
            const ctx = canvas.getContext('2d');
            canvas.style.display = 'inline-block';
            document.getElementById('receive-video').style.display = 'none';

            document.getElementById('status-label').innerText = `📤 送信中 (${protocol.toUpperCase()} / ${fps} FPS)...`;
            log(`【送信開始】 モード: ${protocol} | グリッド: ${gridSize}x${gridSize} | 全 ${totalChunks} コマ`);

            animationTimer = setInterval(() => {
                const start = chunkIdx * chunkSize;
                const payload = textData.substring(start, start + chunkSize);
                
                // ★ヘッダー構造: "現在コマ/全コマ|データ"
                const header = `${chunkIdx + 1}/${totalChunks}|${payload}`;

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (protocol === 'qr') {
                    // QRコードの生成と表示
                    const tempDiv = document.getElementById('qrcode-temp');
                    tempDiv.innerHTML = "";
                    new QRCode(tempDiv, { text: header, width: 400, height: 400 });

                    setTimeout(() => {
                        const img = tempDiv.querySelector('img');
                        if (img) ctx.drawImage(img, 25, 25, 400, 400);
                    }, 30);
                } else {
                    // AprilTag 簡易ビジュアル表現描画 (デモグリッド描画)
                    ctx.fillStyle = "black";
                    ctx.fillRect(0, 0, 450, 450);
                    ctx.fillStyle = "white";
                    ctx.font = "16px monospace";
                    ctx.fillText(`AprilTag Frame: ${chunkIdx + 1}/${totalChunks}`, 20, 30);
                    ctx.fillText(`Payload: ${payload.substring(0, 20)}...`, 20, 60);
                }

                chunkIdx = (chunkIdx + 1) % totalChunks;
            }, 1000 / fps);
        }

        // --- 受信処理 (全コマ収集で自動停止機能つき) ---
        async function runReceiver() {
            const cameraId = document.getElementById('camera-select').value;
            const video = document.getElementById('receive-video');
            const scanCanvas = document.getElementById('scan-canvas');
            const scanCtx = scanCanvas.getContext('2d');
            const recvGrid = parseInt(document.getElementById('recv-grid-size').value) || 3;

            video.style.display = 'inline-block';
            document.getElementById('send-canvas').style.display = 'none';
            document.getElementById('status-label').innerText = "📥 カメラで解析中...";

            receivedChunks = {};
            totalChunksExpected = null;

            log(`【受信開始】 想定グリッド: ${recvGrid}x${recvGrid}`);

            try {
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: cameraId ? { deviceId: { exact: cameraId } } : true
                });
                video.srcObject = videoStream;

                scanTimer = setInterval(() => {
                    if (video.readyState === video.HAVE_ENOUGH_DATA) {
                        scanCanvas.width = video.videoWidth;
                        scanCanvas.height = video.videoHeight;
                        scanCtx.drawImage(video, 0, 0, scanCanvas.width, scanCanvas.height);

                        const imageData = scanCtx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
                        const code = jsQR(imageData.data, imageData.width, imageData.height);

                        if (code && code.data) {
                            parseReceivedData(code.data);
                        }
                    }
                }, 80);

            } catch (err) {
                alert("カメラ起動に失敗しました: " + err.message);
                stopTransmission();
            }
        }

        // 受信パケットの自動解析 & 自動停止
        function parseReceivedData(data) {
            const match = data.match(/^(\d+)\/(\d+)\|(.*)$/s);
            if (match) {
                const currentIdx = parseInt(match[1]);
                totalChunksExpected = parseInt(match[2]);
                const payload = match[3];

                if (!receivedChunks[currentIdx]) {
                    receivedChunks[currentIdx] = payload;
                    const count = Object.keys(receivedChunks).length;
                    
                    log(`⚡ コマGET: [${count} / ${totalChunksExpected}] (コマID: ${currentIdx})`);
                    document.getElementById('status-label').innerText = `📥 受信中... (${count}/${totalChunksExpected})`;

                    // ★【新機能】指定した全コマが揃ったら自動停止！
                    if (count === totalChunksExpected) {
                        let fullText = "";
                        for (let i = 1; i <= totalChunksExpected; i++) {
                            fullText += receivedChunks[i] || "";
                        }
                        log(`🎉【全件受信完了！】\n内容: ${fullText}`);
                        alert("🎉 全コマの読み込みに成功しました！\n\n復元データ:\n" + fullText);
                        stopTransmission(); // 自動停止！
                    }
                }
            }
        }

        window.onload = () => {
            loadCameras();
            navigator.mediaDevices.getUserMedia({ video: true }).then(loadCameras).catch(() => {});
        };
    </script>
</body>
</html>
